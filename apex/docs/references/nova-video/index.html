<!doctype html><html lang="en"><meta charset="utf-8"><title>NOVA motion reference review</title>
<style>body{margin:0;background:#101016;color:#eee;font:14px sans-serif}video{display:block;max-width:100vw;height:calc(100vh - 48px);margin:auto}nav{display:flex;gap:12px;padding:8px;align-items:center}button{padding:5px 12px}span{margin-left:auto}</style>
<video id="reference" src="nova-motion.mp4" muted controls></video><nav><button onclick="reference.pause();reference.currentTime=0">Start</button><button onclick="reference.pause();reference.currentTime=Math.max(0,reference.currentTime-2)">Back 2s</button><button onclick="reference.pause();reference.currentTime=Math.min(reference.duration,reference.currentTime+2)">Next 2s</button><button onclick="reference.paused?reference.play():reference.pause()">Play / pause</button><span id="time"></span></nav>
<script>reference.addEventListener('timeupdate',()=>time.textContent=reference.currentTime.toFixed(2)+' / '+reference.duration.toFixed(2)+' s');reference.addEventListener('loadedmetadata',()=>time.textContent='0 / '+reference.duration.toFixed(2)+' s');</script></html>
